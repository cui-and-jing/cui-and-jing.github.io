# Anzhiyu Theme Configuration Override

menu:
  首页: / || anzhiyu-icon-home
  文章:
    隧道: /archives/ || anzhiyu-icon-box-archive
    分类: /categories/ || anzhiyu-icon-shapes
    标签: /tags/ || anzhiyu-icon-tags
  关于:
    关于本人: /about/ || anzhiyu-icon-paper-plane
    随便逛逛: javascript:toRandomPost() || anzhiyu-icon-shoe-prints1

# 社交图标
social:
  Github: https://github.com/cui-and-jing || anzhiyu-icon-github

# 搜索配置
local_search:
  enable: true
  preload: true
  CDN:

# 评论系统 - Twikoo
comments:
  use: Twikoo
  text: true
  lazyload: false
  count: false
  card_post_count: false

twikoo:
  envId: # 需要配置 Twikoo 环境ID
  region:
  visitor: false
  option:

# 头像
avatar:
  img: /img/avatar.jpg
  effect: false

# 深色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# 简繁转换
translate:
  enable: true
  default: 繁
  defaultEncoding: 2

# 阅读模式
readmode: true

# 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: "记录技术、学习和生活"
  card_announcement:
    enable: true
    content: 欢迎来到我的博客！
  card_weixin:
    enable: false
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
    highlightTags:
      - Hexo
      - 前端
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: false

# 文章目录
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false

# 文章版权
post_copyright:
  enable: true
  decode: false
  location: 中国
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 文章打赏
reward:
  enable: false

# 分享功能
sharejs:
  enable: true
  sites: facebook,twitter,wechat,weibo,qq

# 首页顶部
home_top:
  enable: true
  timemode: date
  title: 生活明朗
  subTitle: 万物可爱。
  category:
    - name: 技术
      path: /categories/技术/
      shadow: var(--anzhiyu-shadow-blue)
      class: blue
      icon: anzhiyu-icon-dove
    - name: 学习
      path: /categories/学习/
      shadow: var(--anzhiyu-shadow-red)
      class: red
      icon: anzhiyu-icon-fire
    - name: 生活
      path: /categories/生活/
      shadow: var(--anzhiyu-shadow-green)
      class: green
      icon: anzhiyu-icon-book

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  custom_text:
  runtime:
    enable: true
    launch_time: 06/15/2026 00:00:00
  footerBar:
    enable: true
    authorLink: /
    cc:
      enable: false
    linkList:
      - link: https://github.com/anzhiyu-c/hexo-theme-anzhiyu
        text: 主题
    subTitle:
      enable: true
      effect: true
      source: 1

# 美化
beautify:
  enable: true
  field: post
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: "#F47466"

# 主题色
theme_color:
  enable: true
  main: "#425AEF"
  dark_main: "#f2b94b"

# 页面顶部图片
index_img: false
default_top_img: false

# 文章封面
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: left

# 文章内容显示
index_post_content:
  method: 3
  length: 500

# 分页
post_pagination: 2

# 相关文章
related_post:
  enable: true
  limit: 6

# 加载动画
preloader:
  enable: true
  source: 3

# 字数统计
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 标签外挂
note:
  style: flat
  icons: true
  border_radius: 3

# 图片查看
fancybox: true

# Pjax
pjax:
  enable: true

# 音乐播放器
nav_music:
  enable: false
  id: 8152976493
  server: netease
  volume: 0.7

# 标签卖萌
diytitle:
  enable: true
  leaveTitle: w(ﾟДﾟ)w 不要走！再看看嘛！
  backTitle: ♪(^∇^*)欢迎肥来！

# 404页面
error_404:
  enable: true
  subtitle: "请尝试站内搜索寻找文章"
  background: https://bu.dusays.com/2023/05/08/645907596997d.gif

# 运行时间
runtimeshow:
  enable: true
  publish_date: 6/15/2026 00:00:00

# 复制功能
copy:
  enable: true
  copyright:
    enable: false
