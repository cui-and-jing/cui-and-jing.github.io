# Anzhiyu Theme Configuration Override

menu:
  首页: / || anzhiyu-icon-home
  归档: /archives/ || anzhiyu-icon-box-archive
  分类: /categories/ || anzhiyu-icon-shapes
  标签: /tags/ || anzhiyu-icon-tags
  友链: /link/ || anzhiyu-icon-link
  关于: /about/ || anzhiyu-icon-paper-plane

# 社交图标
social:
  Github: https://github.com/cui-and-jing || anzhiyu-icon-github

# 搜索配置
local_search:
  enable: true
  preload: true

# 深色模式
darkmode:
  enable: true
  button: true

# 侧边栏
aside:
  enable: true
  position: right
  card_author:
    enable: true
    description: 记录技术、学习和生活
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
  card_tags:
    enable: true
  card_archives:
    enable: true
  card_webinfo:
    enable: true

# 页脚
footer:
  owner:
    enable: true
    since: 2026

# 文章封面
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: left
  default_cover:
    - https://picsum.photos/800/400?random=1

# 文章内容显示
index_post_content:
  method: 3
  length: 500

# 文章元数据
post_meta:
  page:
    date_type: created
    date_format: relative
    categories: true
    tags: true
    label: false
  post:
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

# 版权信息
copyright:
  enable: true
  author_link: https://cui-and-jing.github.io
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 评论系统 (Twikoo)
comments:
  use: twikoo
  text: true

twikoo:
  envId: https://twikoo-five-coral.vercel.app
  region:
  visitor: true
  option:
