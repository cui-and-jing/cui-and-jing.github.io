# Anzhiyu Theme Configuration Override

menu:
  首页: / || anzhiyu-icon-home
  归档: /archives/ || anzhiyu-icon-box-archive
  分类: /categories/ || anzhiyu-icon-shapes
  标签: /tags/ || anzhiyu-icon-tags
  关于: /about/ || anzhiyu-icon-paper-plane

# 社交图标
social:
  Github: https://github.com/cui-and-jing || anzhiyu-icon-github

# 搜索配置
local_search:
  enable: true
  preload: true

# 深色模式
darkmode:
  enable: true
  button: true

# 侧边栏
aside:
  enable: true
  position: right
  card_author:
    enable: true
  card_recent_post:
    enable: true
    limit: 5
  card_categories:
    enable: true
  card_tags:
    enable: true
  card_archives:
    enable: true
  card_webinfo:
    enable: true

# 页脚
footer:
  owner:
    enable: true
    since: 2026

# 文章封面
cover:
  index_enable: true

# 文章内容显示
index_post_content:
  method: 3
  length: 500
